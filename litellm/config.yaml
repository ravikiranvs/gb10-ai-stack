model_list:
  - model_name: qwen3.6-35b
    litellm_params:
      model: openai/qwen3.6-35b
      api_base: http://model-runner:8000/v1
      api_key: unused
      timeout: 900
      stream_timeout: 900
    model_info:
      supports_function_calling: true
      supports_vision: true

  - model_name: agent
    litellm_params:
      model: openai/qwen3.6-35b
      api_base: http://model-runner:8000/v1
      api_key: unused
      timeout: 900
      stream_timeout: 900
    model_info:
      supports_function_calling: true
      supports_vision: true

  # Speech. Whisper runs in model-runner (llama-swap loads it on the first request and unloads it after 5 idle minutes);
  # Kokoro is its own container on the CPU. `whisper-1` and `tts-1` are aliases for clients that hard-code OpenAI's names.
  - model_name: whisper
    litellm_params:
      model: openai/whisper-large-v3-turbo
      api_base: http://model-runner:8000/v1
      api_key: unused
      timeout: 300
    model_info:
      mode: audio_transcription

  - model_name: kokoro
    litellm_params:
      model: openai/kokoro
      api_base: http://kokoro:8880/v1
      api_key: unused
    model_info:
      mode: audio_speech

mcp_servers:
  comfy_image:
    url: http://comfy-mcp:9100/mcp
    transport: http
    description: Local image generation via ComfyUI

litellm_settings:
  default_internal_user_params:
    user_role: internal_user_viewer     # SSO sign-ins start as viewers; promote admins in the UI
  callbacks: ["prometheus", "otel"]
  request_timeout: 900
  drop_params: true

router_settings:
  num_retries: 1
  model_group_alias:
    whisper-1: whisper
    tts-1: kokoro

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Caddy reaches LiteLLM through the Docker bridge; trust its X-Forwarded-For for client IPs and login throttling
  trusted_proxy_ranges: ["127.0.0.1/32", "172.16.0.0/12"]
  database_url: os.environ/DATABASE_URL
