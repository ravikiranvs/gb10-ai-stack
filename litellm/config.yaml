model_list:
  - model_name: qwen3.6-35b
    litellm_params:
      model: openai/qwen3.6-35b
      api_base: http://model-runner:8000/v1
      api_key: unused
      timeout: 900
      stream_timeout: 900
    model_info:
      supports_function_calling: true

  - model_name: qwen3-vl-30b
    litellm_params:
      model: openai/qwen3-vl-30b
      api_base: http://model-runner:8000/v1
      api_key: unused
      timeout: 900
      stream_timeout: 900
    model_info:
      supports_function_calling: true
      supports_vision: true

  - model_name: agent
    litellm_params:
      model: openai/qwen3.6-35b
      api_base: http://model-runner:8000/v1
      api_key: unused
      timeout: 900
      stream_timeout: 900
    model_info:
      supports_function_calling: true

mcp_servers:
  comfy_image:
    url: http://comfy-mcp:9100/mcp
    transport: http
    description: Local image generation via ComfyUI

litellm_settings:
  callbacks: ["prometheus", "otel"]
  request_timeout: 900
  drop_params: true

router_settings:
  num_retries: 1

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
