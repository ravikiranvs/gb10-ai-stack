global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: litellm
    metrics_path: /llm/metrics
    authorization:
      credentials_file: /run/secrets/litellm_master_key
    static_configs:
      - targets: ["litellm:4000"]

  # up == 0 while the model is scaled to zero
  - job_name: vllm-agent
    static_configs:
      - targets: ["model-runner:10001"]
        labels:
          model: qwen3.6-35b

  - job_name: vllm-vision
    static_configs:
      - targets: ["model-runner:10002"]
        labels:
          model: qwen3-vl-30b

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
