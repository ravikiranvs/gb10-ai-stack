# Rendered with X_AUTHELIA_CONFIG_FILTERS=template; PUBLIC_HOST comes from .env
server:
  address: 'tcp://0.0.0.0:9091/auth'

log:
  level: info

theme: auto

totp:
  issuer: '{{ env "PUBLIC_HOST" }}'

webauthn:
  display_name: GB10 AI Stack

authentication_backend:
  file:
    path: /config/users.yml
    watch: true                    # pick up users added by scripts/add-user.sh without a restart
    password:
      algorithm: argon2

access_control:
  default_policy: deny
  rules:
    - domain: '{{ env "PUBLIC_HOST" }}'
      resources:
        - '^/llm/v1/.*$'
      policy: bypass
    - domain: '{{ env "PUBLIC_HOST" }}'
      resources:
        - '^/openclaw([/?].*)?$'
        - '^/connect$'
        - '^/home([/?].*)?$'           # landing page; the dashboard hides and refuses admin-only actions for `users`
      subject:
        - 'group:admins'
        - 'group:users'
      policy: two_factor
    - domain: '{{ env "PUBLIC_HOST" }}'
      resources:
        - '^/llm([/?].*)?$'            # LiteLLM UI: Authelia first, then LiteLLM's own SSO (OIDC client `litellm`, same group)
      subject:
        - 'group:admins'
        - 'group:litellm'
      policy: two_factor
    - domain: '{{ env "PUBLIC_HOST" }}'
      resources:
        - '^/comfy([/?].*)?$'
      subject: 'group:admins'
      policy: two_factor

identity_providers:
  oidc:
    # hmac_secret comes from AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE (compose.yaml)
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/run/secrets/authelia_oidc_jwks_key" | mindent 10 "|" | msquote }}
    claims_policies:
      portainer:                     # shared by all clients: adds groups, e-mail and name to the ID token
        id_token: ['groups', 'email', 'email_verified', 'preferred_username', 'name']
    authorization_policies:
      portainer:
        default_policy: deny
        rules:
          - policy: two_factor
            subject:
              - 'group:admins'
              - 'group:users'
      grafana:
        default_policy: deny
        rules:
          - policy: two_factor
            subject:
              - 'group:admins'
              - 'group:users'
      litellm:                       # LiteLLM's SSO is free for 5 users: only members of the `litellm` group can sign in
        default_policy: deny
        rules:
          - policy: two_factor
            subject: 'group:litellm'
    clients:
      - client_id: portainer
        client_name: Portainer
        client_secret: {{ secret "/run/secrets/portainer_oidc_client_hash" | trim | msquote }}
        public: false
        authorization_policy: portainer
        claims_policy: portainer
        redirect_uris:
          - 'https://{{ env "PUBLIC_HOST" }}/portainer/'
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        token_endpoint_auth_method: client_secret_post
        consent_mode: implicit
      - client_id: grafana
        client_name: Grafana
        client_secret: {{ secret "/run/secrets/grafana_oidc_client_hash" | trim | msquote }}
        public: false
        authorization_policy: grafana
        claims_policy: portainer
        consent_mode: implicit
        redirect_uris:
          - 'https://{{ env "PUBLIC_HOST" }}/grafana/login/generic_oauth'
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        token_endpoint_auth_method: client_secret_basic
      - client_id: litellm
        client_name: LiteLLM
        client_secret: {{ secret "/run/secrets/litellm_oidc_client_hash" | trim | msquote }}
        public: false
        authorization_policy: litellm
        claims_policy: portainer
        consent_mode: implicit
        redirect_uris:
          - 'https://{{ env "PUBLIC_HOST" }}/llm/sso/callback'
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types: ['code']
        grant_types: ['authorization_code']
        token_endpoint_auth_method: client_secret_post

session:
  expiration: 12h
  inactivity: 1h
  cookies:
    - domain: '{{ env "PUBLIC_HOST" }}'
      authelia_url: 'https://{{ env "PUBLIC_HOST" }}/auth'
      default_redirection_url: 'https://{{ env "PUBLIC_HOST" }}/home/'

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 30m

storage:
  local:
    path: /data/db.sqlite3

notifier:
{{- if env "SMTP_ADDRESS" }}
  smtp:
    address: '{{ env "SMTP_ADDRESS" }}'              # smtp://host:587 (STARTTLS) or submissions://host:465 (TLS)
    username: '{{ env "SMTP_USERNAME" }}'
    password: {{ secret "/run/secrets/authelia_smtp_password" | trim | msquote }}
    sender: 'GB10 AI Stack <{{ env "SMTP_SENDER" }}>'
    subject: '[GB10 AI Stack] {title}'
{{- else }}
  filesystem:                                          # no SMTP configured: one-time links are written here
    filename: /data/notification.txt
{{- end }}
