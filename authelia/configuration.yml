# Rendered with X_AUTHELIA_CONFIG_FILTERS=template; PUBLIC_HOST comes from .env
server:
  address: 'tcp://0.0.0.0:9091/auth'

log:
  level: info

theme: auto

totp:
  issuer: '{{ env "PUBLIC_HOST" }}'

webauthn:
  display_name: GB10 AI Stack

authentication_backend:
  file:
    path: /config/users.yml
    password:
      algorithm: argon2

access_control:
  default_policy: deny
  rules:
    - domain: '{{ env "PUBLIC_HOST" }}'
      resources:
        - '^/llm/v1/.*$'
      policy: bypass
    - domain: '{{ env "PUBLIC_HOST" }}'
      resources:
        - '^/openclaw([/?].*)?$'
      subject:
        - 'group:admins'
        - 'group:users'
      policy: two_factor
    - domain: '{{ env "PUBLIC_HOST" }}'
      resources:
        - '^/admin([/?].*)?$'
        - '^/grafana([/?].*)?$'
        - '^/comfy([/?].*)?$'
        - '^/llm([/?].*)?$'
      subject: 'group:admins'
      policy: two_factor

session:
  expiration: 12h
  inactivity: 1h
  cookies:
    - domain: '{{ env "PUBLIC_HOST" }}'
      authelia_url: 'https://{{ env "PUBLIC_HOST" }}/auth'
      default_redirection_url: 'https://{{ env "PUBLIC_HOST" }}/admin/'

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 30m

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt
