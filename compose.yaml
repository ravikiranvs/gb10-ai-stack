name: ai-stack

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

networks:
  ai: {}
  obs: {}
  term: {}                                 # the browser terminal: reaches only the host's dedicated sshd (docker0 gateway)
  notebooks: {}                           # JupyterHub, the per-user notebook containers and LiteLLM; nothing else

secrets:
  authelia_jwt:
    file: ./secrets/authelia_jwt
  authelia_session:
    file: ./secrets/authelia_session
  authelia_storage_key:
    file: ./secrets/authelia_storage_key
  litellm_master_key:
    file: ./secrets/litellm_master_key
  litellm_db_password:
    file: ./secrets/litellm_db_password
  hf_token:
    file: ./secrets/hf_token
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  bridge_dashboard_token:
    file: ./secrets/bridge_dashboard_token
  authelia_smtp_password:                  # empty unless SMTP_ADDRESS is set in .env
    file: ./secrets/authelia_smtp_password
  authelia_oidc_hmac:
    file: ./secrets/authelia_oidc_hmac
  authelia_oidc_jwks_key:
    file: ./secrets/authelia_oidc_jwks_key
  portainer_oidc_client_hash:
    file: ./secrets/portainer_oidc_client_hash
  grafana_oidc_client_hash:
    file: ./secrets/grafana_oidc_client_hash
  litellm_oidc_client_hash:
    file: ./secrets/litellm_oidc_client_hash
  grafana_oidc_secret:
    file: ./secrets/grafana_oidc_secret
  portainer_admin_password:
    file: ./secrets/portainer_admin_password
  bridge_jupyterhub_token:
    file: ./secrets/bridge_jupyterhub_token
  jupyterhub_oidc_secret:
    file: ./secrets/jupyterhub_oidc_secret
  jupyterhub_oidc_client_hash:
    file: ./secrets/jupyterhub_oidc_client_hash
  minio_oidc_client_hash:
    file: ./secrets/minio_oidc_client_hash
  jupyterhub_cred_secret:
    file: ./secrets/jupyterhub_cred_secret
  ssh_ca:
    file: ./secrets/ssh_ca

volumes:
  authelia_data: {}
  litellm_db: {}
  prometheus_data: {}
  loki_data: {}
  tempo_data: {}
  grafana_data: {}
  alloy_data: {}
  textfile: {}
  vllm_cache: {}
  caddy_data: {}                           # Caddy's local CA and certificates for the sandbox MCP listener
  portainer_data: {}                       # Portainer database, license and settings: include in backups
  jupyterhub_data: {}                      # JupyterHub database and cookie secret: include in backups
  minio_data: {}                           # object storage (each person's bucket and `shared`): include in backups
                                           # (each person's files are in the volume `jupyter-<user>`, created by ops-bridge: back those up too)

services:

  # ─────────────────────────── Edge ───────────────────────────
  caddy:
    image: caddy:2.11.7-alpine
    network_mode: host                     # reaches the OpenClaw sandbox forward on host 127.0.0.1:18789
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}          # for the OIDC token listener's X-Forwarded-Host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./branding:/srv/branding:ro
      - ./data/ttyd/run:/run/ttyd           # ttyd's Unix socket (the browser terminal)
      - caddy_data:/data

  authelia:
    image: authelia/authelia:4.39.28
    restart: unless-stopped
    networks: [ai]
    ports: ["127.0.0.1:9091:9091"]
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      PUBLIC_HOST: ${PUBLIC_HOST}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_SENDER: ${SMTP_SENDER:-}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/authelia_jwt
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/authelia_session
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_key
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /run/secrets/authelia_oidc_hmac
      TZ: ${TZ}
    secrets: [authelia_jwt, authelia_session, authelia_storage_key, authelia_smtp_password, authelia_oidc_hmac, authelia_oidc_jwks_key, portainer_oidc_client_hash, grafana_oidc_client_hash, litellm_oidc_client_hash, jupyterhub_oidc_client_hash, minio_oidc_client_hash]
    volumes:
      - ./authelia:/config:ro
      - ./branding:/branding:ro
      - ./authelia/users.yml:/config/users.yml   # read-write so password resets/changes in the UI can be saved
      - authelia_data:/data

  # ─────────────────────────── LLM gateway ───────────────────────────
  litellm-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    networks: [ai]
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD_FILE: /run/secrets/litellm_db_password
    secrets: [litellm_db_password]
    volumes:
      - litellm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10

  litellm:
    image: ${LITELLM_IMAGE}
    restart: unless-stopped
    networks: [ai, obs, notebooks]          # notebooks: the OpenAI-compatible endpoint for people's notebook containers
    ports:
      - "127.0.0.1:4000:4000"
      - "${DOCKER_BRIDGE_IP}:4000:4000"    # reachable from OpenShell sandboxes as host.openshell.internal
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: ./secrets/litellm.env        # LITELLM_MASTER_KEY, DATABASE_URL (created by scripts/init-secrets.sh)
    environment:
      SERVER_ROOT_PATH: /llm
      UI_LOGO_PATH: https://${PUBLIC_HOST}/brand/logo.png   # served by Caddy's /brand route
      LITELLM_FAVICON_URL: /app/branding/favicon.ico
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: litellm
      # SSO: Authelia OIDC (client `litellm`; its secret is GENERIC_CLIENT_SECRET in secrets/litellm.env). Free for 5 users, so Authelia only
      # lets the `litellm` group in. Token/userinfo calls use the docker0 listener in the Caddyfile.
      PROXY_BASE_URL: https://${PUBLIC_HOST}/llm
      GENERIC_CLIENT_ID: litellm
      GENERIC_AUTHORIZATION_ENDPOINT: https://${PUBLIC_HOST}/auth/api/oidc/authorization
      GENERIC_TOKEN_ENDPOINT: http://172.17.0.1:9081/auth/api/oidc/token
      GENERIC_USERINFO_ENDPOINT: http://172.17.0.1:9081/auth/api/oidc/userinfo
      GENERIC_SCOPE: openid profile email groups
      GENERIC_USER_ID_ATTRIBUTE: sub                # stable; preferred_username could change and create a second account
      GENERIC_USER_EMAIL_ATTRIBUTE: email
      GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: name
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./branding:/app/branding:ro
    depends_on:
      litellm-db:
        condition: service_healthy

  # ─────────────────────────── Models ───────────────────────────
  model-runner:
    <<: *gpu
    build:
      context: ./model-runner
      args:
        VLLM_IMAGE: ${VLLM_IMAGE}
        LLAMA_SWAP_VERSION: ${LLAMA_SWAP_VERSION}
    restart: unless-stopped
    networks: [ai, obs]
    ipc: host
    secrets: [hf_token]
    environment:
      HF_TOKEN_PATH: /run/secrets/hf_token
      HF_HOME: /models/hf
      OTEL_EXPORTER_OTLP_TRACES_INSECURE: "true"
      # Keep the compile and JIT caches across container re-creation (cuts a cold start from about 330 s to about 200 s):
      XDG_CACHE_HOME: /cache                # vLLM torch.compile cache + FlashInfer autotune (/cache/vllm)
      TRITON_CACHE_DIR: /cache/triton
      CUDA_CACHE_PATH: /cache/cuda          # the driver JIT-compiles PTX for sm_121 on first use; default cache is lost with the container
      CUDA_CACHE_MAXSIZE: "4294967296"      # 4 GiB (the default 256 MiB would evict)
    volumes:
      - ${MODELS_DIR}/hf:/models/hf
      - vllm_cache:/cache
      - ./model-runner/llama-swap.yaml:/config/config.yaml:ro

  comfyui:
    <<: *gpu
    build:
      context: ./comfyui
      args:
        BASE_IMAGE: ${PYTORCH_IMAGE}
        COMFYUI_REF: ${COMFYUI_REF}
    restart: unless-stopped
    networks: [ai]
    ports: ["127.0.0.1:8188:8188"]
    volumes:
      - ${MODELS_DIR}/comfy:/opt/ComfyUI/models
      - ./data/comfy-output:/opt/ComfyUI/output
      - ./comfyui/workflows:/opt/ComfyUI/user/default/workflows
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8188/system_stats"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  comfy-mcp:
    build: ./comfy-mcp
    restart: unless-stopped
    networks: [ai]
    environment:
      COMFY_URL: http://comfyui:8188
      COMFY_WORKFLOW: /app/workflows/flux-schnell-api.json
      COMFY_DEFAULT_STEPS: ${COMFY_DEFAULT_STEPS}
      COMFY_PUBLIC_URL: https://${PUBLIC_HOST}/comfy   # link returned to the agent (browser opens it through Authelia)
      COMFY_INLINE_IMAGE: "false"                      # true also returns a JPEG inline; OpenClaw turns it into a huge base64 string for the model
      MCP_BIND: 0.0.0.0:9100
    volumes:
      - ./comfyui/workflows:/app/workflows:ro
    depends_on:
      comfyui:
        condition: service_healthy

  # Text to speech (Kokoro 82M) on the CPU: about 3x real time on the Grace cores, so no GPU memory and no idle cost. Internal only;
  # clients reach it through LiteLLM (`kokoro` model, `tts-1` alias). The arm64 CPU image is multi-arch; weights are in the image.
  kokoro:
    image: ${KOKORO_IMAGE}
    restart: unless-stopped
    networks: [ai]
    cpus: 8
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8880/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────── Notebooks ───────────────────────────
  # JupyterHub at /jupyter: sign-in through Authelia OIDC (admins and users), one JupyterLab container per person on NVIDIA's PyTorch
  # image (CUDA torch, sm_121) with its own volume, memory cap and GPU. The Hub has no Docker access: it asks ops-bridge to run the
  # `notebook` template (ops-bridge/actions.yaml). Servers that nobody uses for an hour are stopped; the files stay.
  # The per-user image is only built, never run from here: `docker compose --profile images build notebook-image`.
  notebook-image:
    profiles: [images]
    image: ai-stack-jupyter:latest
    build:
      context: ./jupyter
      args:
        BASE_IMAGE: ${PYTORCH_IMAGE}
        JUPYTERHUB_VERSION: ${JUPYTERHUB_VERSION}
    command: ["true"]

  jupyterhub:
    build:
      context: ./jupyterhub
      args:
        JUPYTERHUB_VERSION: ${JUPYTERHUB_VERSION}
    restart: unless-stopped
    networks: [ai, notebooks]              # ai: reaches ops-bridge; notebooks: reaches the people's containers
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      BRIDGE_URL: http://ops-bridge:9200
      TZ: ${TZ}
    secrets: [bridge_jupyterhub_token, jupyterhub_oidc_secret, jupyterhub_cred_secret]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - jupyterhub_data:/data
    depends_on:
      ops-bridge:
        condition: service_healthy

  # ─────────────────────────── Object storage ───────────────────────────
  # MinIO (the pgsty community fork: upstream's open-source edition is archived and its Docker images are gone). Each person has a bucket
  # `u-<name>` (50 GiB quota) plus the `shared` bucket (everyone reads, each person writes under shared/<name>/). The S3 API is only on the
  # `notebooks` network; the console is served at /s3 and signs people in through Authelia OIDC: the `groups` claim names the policy
  # (minio/policies), so people see only their own bucket and admins see everything. MinIO reads Authelia's discovery document through the
  # TLS alias in the Caddyfile (containers cannot reach the public hostname) and trusts Caddy's local CA for it.
  minio:
    image: ${MINIO_IMAGE}
    restart: unless-stopped
    networks: [notebooks]
    ports: ["127.0.0.1:9001:9001"]          # the console, for Caddy
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: ./secrets/minio.env           # MINIO_ROOT_USER/PASSWORD and the OIDC client secret
    environment:
      MINIO_BROWSER_REDIRECT_URL: https://${PUBLIC_HOST}/s3
      MINIO_IDENTITY_OPENID_CONFIG_URL: https://${PUBLIC_HOST}/auth/.well-known/openid-configuration
      MINIO_IDENTITY_OPENID_CLIENT_ID: minio
      MINIO_IDENTITY_OPENID_CLAIM_NAME: groups
      MINIO_IDENTITY_OPENID_SCOPES: openid,profile,email,groups
      MINIO_IDENTITY_OPENID_DISPLAY_NAME: Authelia
      SSL_CERT_FILE: /certs/caddy-root.crt
      TZ: ${TZ}
    extra_hosts: ["${PUBLIC_HOST}:172.17.0.1"]      # docker0: the Caddy TLS alias
    volumes:
      - minio_data:/data
      - ./data/caddy-root.crt:/certs/caddy-root.crt:ro

  # Helper that holds the `mc` admin tool: sets up `shared` and the policies at start, then idles so ops-bridge can run provisioning in it.
  minio-mc:
    image: ${MC_IMAGE}
    restart: unless-stopped
    networks: [notebooks]
    env_file: ./secrets/minio.env           # MC_HOST_local (root credentials) lives only in this container and MinIO
    entrypoint: ["sh", "/init/init.sh"]
    volumes:
      - ./minio:/init:ro
    healthcheck:
      test: ["CMD-SHELL", "MC_CONFIG_DIR=/tmp/.mc mc ready local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on: [minio]

  # ─────────────────────────── Host shell in the browser ───────────────────────────
  # ttyd serves a terminal at /term (Caddy: Authelia with two-factor first). It trusts the Remote-User header, so it listens only on a Unix
  # socket that Caddy (and its owner) can reach, never on a port; with no header it refuses the connection. For each browser connection it runs
  # gb10-shell, which signs a one-minute SSH certificate for that person with secrets/ssh_ca and opens a login shell on the HOST through the
  # dedicated sshd (port 2222 on docker0, see host/gb10-sshd_config; accounts and limits are set up by the host scripts). The session ends
  # when the shell exits or the tab closes; after `exit` the page waits for Enter instead of starting a new shell by itself (disableReconnect). The container runs as TTYD_UID (the owner of secrets/ssh_ca) with no capabilities and a read-only filesystem.
  ttyd:
    build: ./ttyd
    restart: unless-stopped
    networks: [term]
    user: "${TTYD_UID}:${TTYD_GID}"
    read_only: true
    tmpfs: ["/tmp"]                          # the launcher's throw-away key
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    secrets: [ssh_ca]
    environment:
      GB10_SSH_HOST: gb10-host
    extra_hosts: ["gb10-host:172.17.0.1"]    # docker0: where the dedicated sshd listens
    command: ["-i", "/run/ttyd/ttyd.sock", "-b", "/term", "-W", "-O", "-m", "20", "-H", "Remote-User", "-t", "disableReconnect=true", "-I", "/opt/ttyd/index.html", "gb10-shell"]
    volumes:
      - ./data/ttyd/run:/run/ttyd            # the socket
      - ./data/ttyd/etc:/etc/gb10:ro         # known_hosts: the dedicated sshd's host key

  # ─────────────────────────── Control ───────────────────────────
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    networks: [ai]
    environment:
      CONTAINERS: 1
      INFO: 1
      NETWORKS: 1                          # Alloy's Docker discovery calls GET /networks
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Generic, allow-listed operations on other containers (ops-bridge/actions.yaml). The only service with read-write Docker socket
  # access in this file, so it is built to be small: no published port, internal network only, a fixed catalogue of actions,
  # per-client secrets, audit log on stdout.
  ops-bridge:
    build: ./ops-bridge
    restart: unless-stopped
    networks: [ai]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    secrets: [bridge_dashboard_token, bridge_jupyterhub_token]
    environment:
      BRIDGE_CONFIG: /config/actions.yaml
      NEMOCLAW_SANDBOX: ${NEMOCLAW_SANDBOX}
      NOTEBOOK_IMAGE: ai-stack-jupyter:latest        # built by `docker compose --profile images build notebook-image`
      NOTEBOOK_NETWORK: ai-stack_notebooks           # <project name>_notebooks
      NOTEBOOK_MEM_LIMIT: ${NOTEBOOK_MEM_LIMIT}
    volumes:
      - ./ops-bridge/actions.yaml:/config/actions.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9200/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin-dashboard:
    build: ./dashboard
    restart: unless-stopped
    networks: [ai, obs]
    ports: ["127.0.0.1:9000:9000"]
    environment:
      LLAMA_SWAP_URL: http://model-runner:8000
      COMFY_URL: http://comfyui:8188
      COMFY_WORKFLOW: /app/workflows/flux-schnell-api.json
      COMFY_IDLE_MINUTES: ${COMFY_IDLE_MINUTES}
      DOCKER_URL: http://docker-socket-proxy:2375
      PROMETHEUS_URL: http://prometheus:9090
      ADMIN_GROUP: admins
      USER_GROUP: users
      NEMOCLAW_SANDBOX: ${NEMOCLAW_SANDBOX}
      PUBLIC_HOST: ${PUBLIC_HOST}
      BRIDGE_URL: http://ops-bridge:9200
    secrets: [bridge_dashboard_token]
    volumes:
      - ./comfyui/workflows:/app/workflows:ro
      - /run/gb10-elevate:/run/gb10-elevate   # web.sock of the root daemon behind the Elevate card (host/elevate-setup.sh); only this container's uid can open it
    depends_on:
      ops-bridge:
        condition: service_healthy

  # ─────────────────────────── Container management ───────────────────────────
  # Portainer EE: SSO through Authelia OIDC (authelia/configuration.yml), served at /portainer (Caddy strips the prefix; --base-url makes
  # Portainer's links relative to it). Holds the read-write Docker socket, so it is only reachable through Caddy on localhost.
  # Admins manage everything; users get their own private containers (see README, "Portainer").
  portainer:
    image: ${PORTAINER_IMAGE}
    restart: unless-stopped
    networks: [ai]
    ports: ["127.0.0.1:9010:9000"]
    command: ["--base-url", "/portainer", "--admin-password-file", "/run/secrets/portainer_admin_password"]
    environment:
      TZ: ${TZ}
    secrets: [portainer_admin_password]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  # ─────────────────────────── Observability ───────────────────────────
  alloy:
    image: ${ALLOY_IMAGE}
    restart: unless-stopped
    networks: [obs, ai]
    ports:
      - "${DOCKER_BRIDGE_IP}:4318:4318"    # OTLP/HTTP for the OpenClaw sandbox
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy
    depends_on: [docker-socket-proxy]      # container logs are read through the read-only proxy, not the socket

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    restart: unless-stopped
    networks: [obs, ai]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
    secrets: [litellm_master_key]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: ${LOKI_IMAGE}
    restart: unless-stopped
    networks: [obs]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  tempo:
    image: ${TEMPO_IMAGE}
    restart: unless-stopped
    networks: [obs]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo

  grafana:
    image: ${GRAFANA_IMAGE}
    restart: unless-stopped
    networks: [obs]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # SSO: Authelia OIDC (client `grafana`). Role comes from the `groups` claim: admins → Admin, everyone else → Viewer.
      # Token/userinfo calls use the docker0 listener in the Caddyfile (containers cannot reach the public hostname).
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Authelia
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"                  # break-glass form: /grafana/login?disableAutoLogin=true (built-in admin)
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/grafana_oidc_secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://${PUBLIC_HOST}/auth/api/oidc/authorization
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://172.17.0.1:9081/auth/api/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://172.17.0.1:9081/auth/api/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'admins') && 'Admin' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://${PUBLIC_HOST}/auth/logout
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password   # replaces the built-in admin/admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets: [grafana_admin_password, grafana_oidc_secret]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Branding: OSS Grafana has no white-labelling setting, so replace its bundled icons (menu logo, favicon, touch icon)
      - ./branding/grafana/grafana_icon.svg:/usr/share/grafana/public/img/grafana_icon.svg:ro
      - ./branding/grafana/fav32.png:/usr/share/grafana/public/img/fav32.png:ro
      - ./branding/grafana/apple-touch-icon.png:/usr/share/grafana/public/img/apple-touch-icon.png:ro
      - grafana_data:/var/lib/grafana

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    restart: unless-stopped
    networks: [obs]
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --no-collector.cpufreq             # hangs intermittently on the GB10 and stalls the whole scrape (7 of 30 scrapes succeeded with it, 30 of 30 without)
    volumes:
      - /:/host:ro,rslave
      - textfile:/textfile:ro

  cadvisor:
    image: ${CADVISOR_IMAGE}
    restart: unless-stopped
    networks: [obs]
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  gpu-exporter:
    <<: *gpu
    build: ./observability/gpu-exporter
    restart: unless-stopped
    network_mode: none
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
      INTERVAL_SECONDS: "10"
    volumes:
      - textfile:/textfile
